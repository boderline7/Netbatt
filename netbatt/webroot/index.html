<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NetBatt 控制台</title>
<style>
:root{
  --bg:#0f1216; --card:#171c22; --line:#242c36; --fg:#e8edf3; --dim:#8b98a8;
  --acc:#3ddc84; --warn:#f5a524; --bad:#f0506e; --blue:#4c8dff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:focus{outline:none}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.5 -apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
  padding:14px 12px 36px;max-width:640px;margin:0 auto}
h1{font-size:17px;margin:0}
header{position:relative;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hdr{display:flex;align-items:center}
.hdr > * + *{margin-left:8px}
.badge{font-size:12.5px;padding:5px 11px;border-radius:20px;background:#1d2a22;color:var(--acc);
  border:1px solid #24402f;font-family:inherit;font-weight:500}
.badge::after{content:" ⌄";color:#4f7a63}
.iconbtn{padding:5px 10px;font-size:14px;line-height:1.25;border-radius:18px;background:#1b222b;
  border:1px solid var(--line);color:var(--dim)}
.iconbtn:active{color:var(--fg)}
/* 网络地址：点徽标从右上角展开，不再单占一张卡 */
.pop{position:absolute;right:0;top:calc(100% + 8px);z-index:8;min-width:236px;
  background:#1b2129;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  box-shadow:0 12px 32px #000a}
.pop[hidden]{display:none}
.pop .prow{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;
  border-bottom:1px dashed #202832}
.pop .prow:last-of-type{border:0}
.pop .prow span{color:var(--dim)}
.pop .prow b{font-family:ui-monospace,Consolas,monospace;font-weight:600}
.pop .pfoot{font-size:12px;color:var(--dim);margin-top:6px;padding-top:7px;border-top:1px solid #202832;
  word-break:break-all}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:12.5px;color:var(--dim);font-weight:600;letter-spacing:.04em;margin:0;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center}
.row > * + *{margin-left:10px}
input[type=text]{width:100%;background:#0e1216;border:1px solid var(--line);color:var(--fg);
  border-radius:9px;padding:9px 12px;font-size:15px;font-family:ui-monospace,Consolas,monospace}
input[type=text]:focus{outline:none;border-color:var(--blue)}
button{background:#222b36;color:var(--fg);border:1px solid #2f3946;border-radius:9px;
  padding:9px 13px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;
  -webkit-appearance:none;appearance:none;outline:none;
  transition:background .15s,border-color .15s,transform .1s,color .15s;
  -webkit-user-select:none;user-select:none}
/* WebView 会在按住/聚焦时画一圈方框，很难看，全部关掉，改用背景和缩放做反馈 */
button:focus,button:focus-visible,button:active{outline:none}
button:active{transform:scale(.96);background:#2b3542;border-color:#3b4757}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button.on{background:#14301f;border-color:var(--acc);color:var(--acc)}
button.active{background:var(--acc);border-color:var(--acc);color:#0b1a12;font-weight:600}
button:disabled{opacity:.4;cursor:default}
button:disabled:active{transform:none}
/* 两张开关卡并排：内容压到最短，细节交给下面的链路条 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid2 > .card{margin:0}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.tag{font-size:11.5px;padding:5px 9px;border-radius:20px;background:#1e2733;border:1px solid #303b4a;
  color:#c3cede;font-weight:500;display:inline-flex;align-items:center;line-height:1.1;
  white-space:nowrap;flex:0 0 auto}
/* 状态圆点：灰=关，绿=开，一眼能看出这是可点的开关 */
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:#5b6779;
  margin-right:6px;flex:0 0 auto}
.tag.on{background:#14301f;border-color:#2f6b47;color:var(--acc)}
.tag.on::before{background:var(--acc);box-shadow:0 0 6px #3ddc8488}
.tag:active{transform:scale(.95)}
.big{font-size:19px;font-weight:600;margin-bottom:10px}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns2 button{padding:8px 6px;font-size:13.5px}
.btns3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.btns3 button{padding:8px 4px;font-size:13px}
.sub{font-size:12.5px;color:var(--dim);margin-top:6px;word-break:break-all}
.sub b{color:var(--fg);font-family:ui-monospace,Consolas,monospace;font-weight:600;white-space:nowrap}
.warnrow{display:flex;align-items:center;justify-content:space-between;
  font-size:12px;color:var(--warn);margin-top:8px;padding:6px 9px;border-radius:8px;
  background:#2a2114;border:1px solid #4a3a15}
.chips{display:flex;flex-wrap:wrap;margin-bottom:-7px}
.chip{font-size:12.5px;color:var(--dim);background:#0e1216;border:1px solid var(--line);
  border-radius:8px;padding:5px 10px;white-space:nowrap;margin:0 7px 7px 0}
.chip b{color:var(--fg);font-weight:600;margin-left:2px}
.q4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q4 button{padding:8px 4px;font-size:13px}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;
  border-bottom:1px dashed #1e252e}
.kv:last-of-type{border:0}
.kv span{color:var(--dim)}
.kv b{font-family:ui-monospace,Consolas,monospace;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--dim);font-weight:500;font-size:11.5px;padding:6px 3px;border-bottom:1px solid var(--line)}
td{padding:8px 3px;border-bottom:1px solid #1b2129;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
td.name{font-family:inherit}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:5px}
.empty{color:var(--dim);font-size:13px;padding:12px 0;text-align:center}
.batt{display:flex;align-items:baseline;margin-bottom:8px}
.batt b{font-size:38px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
/* 间距用 margin 给死：部分 WebView 对 flex 的 gap 支持不全，用 gap 会贴在一起 */
.batt .unit{color:var(--dim);font-size:15px;margin-left:14px;flex:0 0 auto}
.batt #bstat{margin-left:auto;color:var(--dim);font-size:13.5px;white-space:nowrap;padding-left:10px}
.slabel{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--dim);margin-top:8px}
.slabel b{font-size:14.5px;color:var(--fg);font-family:ui-monospace,Consolas,monospace}
.slider{position:relative;height:34px;display:flex;align-items:center}
/* 轨道左右各内缩滑块半径，使填充末端与滑块中心始终对齐 */
.slider .track{position:absolute;left:12px;right:12px;height:8px;border-radius:4px;background:#2a323c}
.slider .fill{height:100%;border-radius:4px;width:50%;background:var(--acc)}
.slider.blue .fill{background:var(--blue)}
.slider input[type=range]{position:relative;z-index:1;width:100%;height:34px;margin:0;
  -webkit-appearance:none;background:transparent}
.slider input[type=range]::-webkit-slider-runnable-track{height:34px;background:transparent}
.slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
  border-radius:50%;background:#fff;border:4px solid var(--acc);margin-top:6px;
  box-shadow:0 1px 6px #0006}
.slider.blue input[type=range]::-webkit-slider-thumb{border-color:var(--blue)}
.slider input[type=range]:disabled::-webkit-slider-thumb{background:#8b98a8;border-color:#4a5563;box-shadow:none}
.slider.locked .fill{opacity:.45}
.hint{font-size:12.5px;color:var(--dim);margin-top:8px}
.hint .dot{margin-right:5px}
.logbox{background:#0b0e12;border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin:0 0 10px;
  font:12px/1.55 ui-monospace,Consolas,"Noto Sans Mono",monospace;color:#c8d3df;
  max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all;-webkit-overflow-scrolling:touch}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:#2b3440;color:#fff;padding:10px 18px;border-radius:22px;font-size:13.5px;
  opacity:0;transition:.25s;pointer-events:none;z-index:9;box-shadow:0 8px 24px #000a}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <h1>NetBatt 控制台</h1>
  <div class="hdr">
    <button class="badge" id="badge">--</button>
    <button class="iconbtn" id="hardReload">刷新</button>
  </div>
  <div class="pop" id="addrPop" hidden>
    <div id="ifaces"><div class="prow"><span>加载中</span></div></div>
    <div class="pfoot">控制台 <span id="web">--</span></div>
  </div>
</header>

<div class="grid2">
  <section class="card">
    <div class="mh">
      <h2>热点</h2>
      <button class="tag" id="keepWifi">保活</button>
    </div>
    <div class="big" id="apState">--</div>
    <div class="btns2">
      <button id="apOn">开启</button>
      <button id="apOff">关闭</button>
    </div>
  </section>

  <section class="card">
    <div class="mh">
      <h2>USB 网桥</h2>
      <button class="tag" id="keepUsb">保活</button>
    </div>
    <div class="big" id="usbState">--</div>
    <div class="btns2">
      <button id="usbOn">开启</button>
      <button id="usbOff">关闭</button>
    </div>
  </section>
</div>

<div class="card" style="padding:11px 14px">
  <div class="chips">
    <span class="chip">DHCP<b id="dhcpState">--</b></span>
    <span class="chip">链路<b id="usbNet">--</b></span>
    <span class="chip">上行<b id="uplinkState">--</b></span>
  </div>
</div>

<div class="grid2">
  <section class="card">
    <div class="mh"><h2>USB 类型</h2></div>
    <div class="q4">
      <button data-net="auto">自动</button>
      <button data-net="rndis">RNDIS</button>
      <button data-net="ncm">NCM</button>
      <button data-net="ecm">ECM</button>
    </div>
    <div class="sub" id="usbFunc">--</div>
  </section>

  <section class="card">
    <div class="mh"><h2>无线 ADB</h2></div>
    <div class="big" id="adbState">--</div>
    <div class="sub" id="adbPort">--</div>
    <div class="btns2" style="margin-top:10px">
      <button id="adbToggle">开启</button>
      <button class="tag" id="adbBoot" style="justify-content:center">自启：关</button>
    </div>
    <div class="warnrow" id="adbResidueRow" style="display:none">
      <span id="adbResidue">--</span>
      <button class="tag" id="adbClear" style="color:var(--warn);border-color:#4a3a15">清理</button>
    </div>
  </section>
</div>

<div class="card">
  <h2>电量 / 充电阈值</h2>
  <div class="batt"><b id="cap">--</b><small class="unit">%</small><small id="bstat"></small></div>

  <div class="slabel"><span>充电上限</span><b id="pcapv">88</b></div>
  <div class="slider locked" id="pwrap">
    <div class="track"><div class="fill" id="pfill"></div></div>
    <input type="range" id="pcap" min="20" max="100" step="1" value="88" disabled>
  </div>

  <div class="slabel"><span>恢复阈值</span><b id="rcapv">83</b></div>
  <div class="slider blue locked" id="rwrap">
    <div class="track"><div class="fill" id="rfill"></div></div>
    <input type="range" id="rcap" min="5" max="99" step="1" value="83" disabled>
  </div>

  <div class="btns3" style="grid-template-columns:1fr 1.1fr 1fr 1fr">
    <button id="editToggle">编辑</button>
    <button id="chgStart">启动</button>
    <button id="chgRestart">重启</button>
    <button class="danger" id="chgStop">停止</button>
  </div>
  <div class="hint"><span id="chgdot" class="dot" style="background:#555"></span><span id="chgtxt">控制器状态未知</span> · <span id="temp">--</span>℃</div>
  <div class="hint" style="margin-top:5px"><span id="powdot" class="dot" style="background:#555"></span><span id="powtxt">--</span></div>
  <div class="hint" style="margin-top:5px" id="chgch">充电通道：--</div>
</div>

<div class="card">
  <div class="mh">
    <h2>设备与端口转发</h2>
    <button class="tag" id="fwdToggle">转发设置</button>
  </div>
  <div id="fwdPanel" hidden>
    <div class="row" style="margin-bottom:8px">
      <input type="text" id="fwdPort" placeholder="端口，例如 18765" inputmode="numeric" style="flex:1">
      <button class="primary" id="fwdAdd">添加</button>
    </div>
    <div id="fwdList"></div>
    <div class="sub">目标设备 <b id="fwdTarget">--</b>（自动跟随）</div>
  </div>

  <div style="margin-top:10px">
    <h2 style="margin-bottom:6px">已连接设备 <span id="cnt" style="color:var(--fg)"></span></h2>
    <table>
      <thead><tr><th>IP</th><th>名称</th><th>MAC</th></tr></thead>
      <tbody id="devs"><tr><td colspan="3" class="empty">暂无设备</td></tr></tbody>
    </table>
  </div>
</div>

<div class="card">
  <div class="mh">
    <h2>运行日志</h2>
    <span class="sub" style="margin:0" id="logSize">--</span>
  </div>
  <pre class="logbox" id="logBox">加载中…</pre>
  <div class="btns3">
    <button id="logReload">刷新</button>
    <button id="logDl">下载</button>
    <button class="danger" id="logClear">清空</button>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);

// 页面构建号：与 module.prop 的 versionCode 保持一致。
// WebView 会缓存 HTML，模块升级后 APP 里可能还是旧页面；
// 拿到 status 一看 build 对不上就自动换 URL 拉新的。
const PAGE_BUILD = __BUILD__;

const ROLE = {up:'上级代理', hotspot:'热点端', usb:'USB 端', mobile:'移动数据', other:'其它接口'};

// 内核报的是英文状态，界面上统一中文
const BSTAT = {Charging:'充电中', Discharging:'放电中', Full:'已充满',
  'Not charging':'未充电', Unknown:''};

let ST = {};

// 强制刷新：reload() 在 APP 里可能还是命中旧副本，换 URL 带时间戳才是新资源
function hardReload(){
  const b = $('#hardReload');
  if(b){ b.textContent = '…'; b.disabled = true; }
  location.replace(location.pathname + '?r=' + Date.now());
}

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800);
}
async function api(action, extra={}){
  const p = new URLSearchParams({a:action, ...extra});
  const r = await fetch('/cgi-bin/api.sh?'+p.toString(), {cache:'no-store'});
  return await r.json();
}

function bridge(){ return (window.NetBatt && window.NetBatt.setHotspot) ? window.NetBatt : null; }

function render(s){
  ST = s;

  // 缓存里的旧页面：60 秒内只自动跳一次，避免死循环
  if(s.build && +s.build !== PAGE_BUILD){
    const last = +sessionStorage.getItem('nb_rl') || 0;
    if(Date.now() - last > 60000){
      sessionStorage.setItem('nb_rl', Date.now());
      location.replace(location.pathname + '?v=' + s.build);
      return;
    }
  }

  // 顶栏徽标显示对端真正能访问的地址；什么都没共享时不编一个出来
  const host = (s.web||'').replace(/^https?:\/\//,'').replace(/:\d+$/,'');
  $('#badge').textContent = host || '未共享';

  // 接口列表收进右上角那个徽标里，页面不再单占一张卡
  $('#ifaces').innerHTML = s.ifaces.length
    ? s.ifaces.map(i=>{
        const r = ROLE[i.role] || '其它接口';
        const label = i.role==='mobile' ? r + '（外部不可达）' : r;
        return `<div class="prow"><span>${label}</span><b>${i.ip}</b></div>`;
      }).join('')
    : '<div class="prow"><span>当前没有共享接口</span></div>';
  $('#web').textContent = s.web || 'http://127.0.0.1:8080（本机）';

  $('#apState').textContent = s.ap==1 ? '已开启' : '未开启';
  $('#apState').style.color = s.ap==1 ? 'var(--acc)' : 'var(--dim)';
  pair('#apOn','#apOff', s.ap);

  if(s.usb==1) $('#usbState').textContent = '已开启';
  else if(s.usb_online==1) $('#usbState').textContent = '已插线';
  else $('#usbState').textContent = '未开启';
  $('#usbState').style.color = s.usb==1 ? 'var(--acc)' : 'var(--dim)';
  pair('#usbOn','#usbOff', s.usb);

  const DHCP_TXT = {idle:'空闲', hotspot_stopping:'让出热点中', wait_port:'等待 67 释放',
    dnsmasq_starting:'启动 DHCP 服务', wait_client:'等待 ACK', dnsmasq_stopping:'撤回 DHCP 服务',
    hotspot_restoring:'恢复热点中', verify_restored:'校验链路中', cooldown:'已回滚，冷却中'};
  $('#dhcpState').textContent = DHCP_TXT[s.dhcp] || s.dhcp || '--';
  $('#dhcpState').style.color = (s.dhcp && s.dhcp!=='idle' && s.dhcp!=='cooldown') ? 'var(--acc)'
    : (s.dhcp==='cooldown' ? '#e5a00d' : '');

  const NET_TXT = {ok:'可用', no_gw:'网关已丢', no_peer:'对端未解析',
    conflict:'网段冲突', down:'无接口', unknown:'未知'};
  $('#usbNet').textContent = NET_TXT[s.usb_net] || s.usb_net || '--';
  $('#usbNet').style.color = s.usb_net==='ok' ? 'var(--acc)'
    : (s.usb_net==='conflict'||s.usb_net==='no_gw' ? 'var(--bad)' : '');
  $('#uplinkState').textContent = s.uplink==='ok' ? '正常' : (s.uplink==='down' ? '不可用' : '未知');
  $('#uplinkState').style.color = s.uplink==='ok' ? 'var(--acc)'
    : (s.uplink==='down' ? '#e5a00d' : '');

  // USB 类型：显示实际生效的 function，高亮的是配置值（auto 就是自动）
  const NET_NAME = {rndis:'RNDIS', ncm:'NCM', ecm:'ECM'};
  const elFunc = $('#usbFunc');
  const linkWarn = (s.usb_mode === 'manual' && s.usb_linked == 0);
  elFunc.textContent = (NET_NAME[s.usb_func] || s.usb_func || '--')
    + (s.usb_mode === 'native' ? ' · 系统共享'
       : s.usb_mode === 'manual' ? ' · 模块自建' : '')
    + (linkWarn ? ' · 未链接' : '');
  elFunc.style.color = linkWarn ? '#e5a00d' : '';
  document.querySelectorAll('button[data-net]').forEach(b=>{
    b.classList.toggle('active', b.dataset.net === s.usb_net_cfg);
  });

  const ADB_TXT = {0:'已关闭', 1:'监听中', 2:'已配置，未监听'};
  $('#adbState').textContent = ADB_TXT[s.adb_tcp] || '--';
  $('#adbState').style.color = s.adb_tcp==1 ? 'var(--acc)'
    : (s.adb_tcp==2 ? '#e5a00d' : 'var(--dim)');
  $('#adbToggle').textContent = s.adb_tcp==1 ? '关闭' : '开启';
  $('#adbToggle').classList.toggle('on', s.adb_tcp==1);

  // 开机自启是独立开关：只决定下次开机要不要自动把端口挂回去
  const boot = s.adb_boot==1;
  const eb = $('#adbBoot');
  eb.textContent = '自启';
  eb.classList.toggle('on', boot);
  eb.title = '开机自启：' + (boot ? '开' : '关');

  // 老模块留下的 persist 属性：不清掉，开发者选项一直进不去
  const resid = s.adb_persist || '';
  $('#adbResidueRow').style.display = resid ? 'flex' : 'none';
  $('#adbResidue').textContent = resid ? ('persist=' + resid) : '';
  // 这个端口是给"另一台设备"连的：只列对端真能走到的接口，
  // 蜂窝地址（ccmni/rmnet）在运营商内网，写上去也连不通
  if(s.adb_tcp==1 && s.adb_port){
    const reach = s.ifaces.filter(i=>i.role==='usb' || i.role==='hotspot' || i.role==='up');
    if(reach.length){
      const urls = reach.map(i=>i.ip.split('/')[0]+':'+s.adb_port);
      // 地址单独占一行，别从中间断开
      $('#adbPort').innerHTML = '另一台设备连<br><b>' + urls.join('</b><br><b>') + '</b>';
    }else{
      $('#adbPort').textContent = '监听 ' + s.adb_port + ' · 开 USB 共享或热点后这里会显示可连地址';
    }
  }else{
    $('#adbPort').textContent = s.adb_port ? ('端口 ' + s.adb_port) : '端口未监听';
  }

  keepBtn('#keepWifi', s.keep_wifi, '热点');
  keepBtn('#keepUsb', s.keep_usb, 'USB');

  $('#cnt').textContent = s.count ? `(${s.count})` : '';
  $('#devs').innerHTML = s.count
    ? s.clients.map(c=>`<tr><td>${c.ip}</td><td class="name"><span class="dot"></span>${c.host||'-'}</td><td>${c.mac}</td></tr>`).join('')
    : '<tr><td colspan="3" class="empty">暂无设备</td></tr>';

  const b = s.batt;
  $('#cap').textContent = b.cap;
  $('#bstat').textContent = BSTAT[b.status] || b.status || '';
  $('#temp').textContent = b.temp;
  paintPower(b, s);

  if(!editing){
    $('#pcap').value = b.pc; paint('#pcap','#pcapv');
    $('#rcap').value = b.rc; paint('#rcap','#rcapv');
  }

  $('#chgdot').style.background = b.enabled ? 'var(--acc)' : '#555';
  $('#chgtxt').textContent = b.enabled ? '控制器运行中' + (b.state==='off'?'（暂停充电）':'（充电中）') : '控制器已停止';
  $('#chgStart').classList.toggle('active', !!b.enabled);
  $('#chgStop').classList.toggle('active', !b.enabled);
  $('#chgch').textContent = chgDesc(b);
  $('#fwdTarget').textContent = s.target || '--';
  $('#logSize').textContent = bytes(s.log_size) + ' / ' + bytes(s.log_max);
  renderFwd(s.fwd);
}

// 日志占用：字节数直接给出来，别让人自己算
function bytes(n){
  n = +n || 0;
  if(n >= 1048576) return (n/1048576).toFixed(2) + ' MB';
  if(n >= 1024) return (n/1024).toFixed(1) + ' KB';
  return n + ' B';
}

// 只读最近 150 行：整个文件动辄几 MB，没必要每次全拉
async function loadLog(){
  const box = $('#logBox');
  if(!box) return;
  try{
    const r = await fetch('/cgi-bin/api.sh?a=log&n=150', {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const t = await r.text();
    // 用户往上翻的时候不要强行拽回底部
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 32;
    box.textContent = t.trim() || '（暂无记录）';
    if(nearBottom) box.scrollTop = box.scrollHeight;
  }catch(e){
    box.textContent = '读取失败：' + e.message;
  }
}

// 充电通道说明：骁龙走开关节点，天玑(vivo)走目标电量节点
function chgDesc(b){
  if(!b.ch || b.ch==='none') return '充电通道：未找到可控节点';
  const plat = {qcom:'骁龙', mtk:'天玑'}[b.plat] || '其他平台';
  const node = (b.node||'').split('/').filter(Boolean).pop() || '--';
  if(b.ch==='soc'){
    const o = b.soc_orig ? `（接管前 ${b.soc_orig}）` : '';
    return `充电通道：${plat} · 目标电量型 ${node}=${b.sw}${o}`;
  }
  return `充电通道：${plat} · 开关型 ${node}=${b.sw}`;
}

// 端口转发列表
function renderFwd(list){
  const box = $('#fwdList');
  list = list || [];
  if(!list.length){
    box.innerHTML = '<div class="sub">暂无转发端口</div>';
    return;
  }
  box.innerHTML = list.map(p =>
    `<div class="kv"><span>${p}</span><button class="ghost" data-p="${p}" style="padding:2px 9px;font-size:12px">移除</button></div>`
  ).join('');
  box.querySelectorAll('button[data-p]').forEach(b=>{ b.onclick = ()=>fwdOp('del', b.dataset.p); });
}

async function fwdOp(op, port){
  try{
    const r = await api('fwd', {op, port});
    if(r && r.ok===0){ toast('端口不合法'); return; }
    const all = await api('fwd', {});
    renderFwd(all.fwd);
    toast(op==='add' ? '已添加转发 ' + port : '已移除 ' + port);
  }catch(e){ toast('操作失败'); }
}

// 当前生效的那个动作高亮，另一个变暗
function pair(onSel, offSel, on){
  const a=$(onSel), b=$(offSel);
  a.classList.toggle('active', on==1);
  b.classList.toggle('active', on!=1);
}

// 电流有符号：正=充入，负=放出；功率 = 电压 × 电流
function paintPower(b, s){
  const w = +(b.w||0), a = +(b.a||0);
  let txt, col;
  if(b.dir==='full'){ txt = '已充满 · 待机'; col = 'var(--acc)'; }
  else if(b.dir==='chg'){ txt = `正在充电 · ${a.toFixed(2)} A · +${w.toFixed(1)} W`; col = 'var(--acc)'; }
  else if(b.dir==='dis'){ txt = `正在放电 · ${Math.abs(a).toFixed(2)} A · ${w.toFixed(1)} W`; col = '#ff8a5c'; }
  else { txt = '待机 · 电流可忽略'; col = '#555'; }
  if(b.usb_max>0 && b.usb_max<=500000 && s.ap==1 && w<1.5)
    txt += `｜USB 口只给 ${(b.usb_max/1000000).toFixed(1)} A`;
  $('#powtxt').textContent = txt;
  $('#powdot').style.background = col;
}
function paint(id, vid){
  const el=$(id), v=+el.value, mn=+el.min, mx=+el.max;
  $(vid).textContent=v;
  $(id==='#pcap' ? '#pfill' : '#rfill').style.width = ((v-mn)/(mx-mn)*100)+'%';
}

// 保活按钮：开=高亮
function keepBtn(sel, on, name){
  const el=$(sel); if(!el) return;
  el._on = on==1 ? 1 : 0;
  el.textContent = '保活';
  el.classList.toggle('on', !!el._on);
  // 状态写进 title，浏览器里长按/悬停能看到；手机上看圆点颜色
  el.title = name + '保活：' + (el._on ? '开' : '关');
}

async function refresh(){
  try{ render(await api('status')); }
  catch(e){ console.warn(e); }
}

function clampPair(){
  let p=+$('#pcap').value, r=+$('#rcap').value;
  if(r>=p){ r=p-1; $('#rcap').value=r; }
  if(r<5){ r=5; $('#rcap').value=r; }
  return {p,r};
}
async function pushBatt(){
  const {p,r} = clampPair();
  paint('#pcap','#pcapv'); paint('#rcap','#rcapv');
  try{
    const j = await api('batt',{pause:p, resume:r});
    if(!j.ok) throw new Error('invalid');
    toast(`上限 ${p}% · 低于 ${r}% 恢复充电`);
    refresh();
  }catch(e){ toast('设置失败'); }
}

$('#pcap').addEventListener('input', ()=>{ clampPair(); paint('#pcap','#pcapv'); paint('#rcap','#rcapv'); });
$('#rcap').addEventListener('input', ()=>{ clampPair(); paint('#pcap','#pcapv'); paint('#rcap','#rcapv'); });

// 阈值默认锁定，必须点“编辑阈值”才能拖，避免误触改配置
let editing = false;
function setEdit(on){
  editing = on;
  $('#pcap').disabled = !on;
  $('#rcap').disabled = !on;
  $('#pwrap').classList.toggle('locked', !on);
  $('#rwrap').classList.toggle('locked', !on);
  const b = $('#editToggle');
  b.textContent = on ? '保存' : '编辑';
  b.classList.toggle('on', on);
  if(!on) pushBatt();
}
$('#editToggle').addEventListener('click', ()=>setEdit(!editing));

// 网络地址浮层：点徽标开关，点别处收起
$('#badge').addEventListener('click', e=>{
  e.stopPropagation();
  const p = $('#addrPop');
  p.hidden = !p.hidden;
});
document.addEventListener('click', e=>{
  const p = $('#addrPop');
  if(!p.hidden && !e.target.closest('#addrPop')) p.hidden = true;
});

$('#fwdToggle').addEventListener('click', ()=>{
  const p = $('#fwdPanel');
  p.hidden = !p.hidden;
  $('#fwdToggle').classList.toggle('on', !p.hidden);
});

$('#fwdAdd').addEventListener('click', ()=>{
  const v = $('#fwdPort').value.trim();
  if(!/^\d{1,5}$/.test(v) || +v < 1 || +v > 65535){ toast('端口需为 1-65535'); return; }
  fwdOp('add', v);
  $('#fwdPort').value = '';
});

// 开关热点 / USB 共享：APP 内走 JS 接口，浏览器里交给 CGI 转发特权应用
async function setShare(type, on){
  const name = type==='usb' ? 'USB 共享' : '热点';
  const nb = bridge();
  if(nb && type!=='usb'){
    try{
      const r = nb.setHotspot(!!on);
      toast(r || ('已请求' + (on?'开启':'关闭') + name));
      setTimeout(refresh, 2500);
    }catch(e){ toast('调用特权接口失败：'+e); }
    return;
  }
  try{
    await api('hs',{type:type, on: on?1:0});
    toast('已请求' + (on?'开启':'关闭') + name);
    setTimeout(refresh, 2500);
  }catch(e){ toast('操作失败'); }
}
$('#apOn').addEventListener('click', ()=>setShare('wifi',true));
$('#apOff').addEventListener('click', ()=>setShare('wifi',false));
$('#usbOn').addEventListener('click', ()=>setShare('usb',true));
$('#usbOff').addEventListener('click', ()=>setShare('usb',false));

// USB 网络类型切换：对端看不到网卡时是这里的问题，不是 DHCP
document.querySelectorAll('button[data-net]').forEach(b=>{
  b.onclick = async ()=>{
    try{
      const r = await api('usbnet', {net:b.dataset.net});
      if(!r || !r.ok){
        toast(r && r.error==='func_missing' ? '本机不支持该网络功能' : '切换失败');
        return;
      }
      toast('USB 网络：' + (b.dataset.net==='auto' ? '自动' : b.dataset.net.toUpperCase()));
      setTimeout(refresh, 2600);
    }catch(e){ toast('切换失败'); }
  };
});

async function setAdb(on){
  try{
    const r = await api('adbtcp', {on: on?1:0});
    if(!r || !r.ok){ toast('操作失败'); return; }
    toast(on ? '无线 ADB 已开启' : '无线 ADB 已关闭');
    setTimeout(refresh, 1600);
  }catch(e){ toast('操作失败'); }
}
// 一个按钮切换：当前监听中就关，否则开
$('#adbToggle').addEventListener('click', ()=>setAdb(!(ST.adb_tcp==1)));
$('#adbBoot').addEventListener('click', async ()=>{
  const v = ST.adb_boot==1 ? 0 : 1;
  try{
    const r = await api('adbboot',{on:v});
    if(!r || !r.ok){ toast('设置失败'); return; }
    toast('开机自启已' + (v?'开启':'关闭'));
    setTimeout(refresh, 600);
  }catch(e){ toast('设置失败'); }
});
$('#adbClear').addEventListener('click', async ()=>{
  try{
    const r = await api('clearpersist', {});
    toast(r && r.ok ? '已清理，重启后开发者选项恢复' : '清理失败');
    setTimeout(refresh, 1200);
  }catch(e){ toast('清理失败'); }
});

async function toggleKeep(key, sel){
  const el=$(sel);
  const v = el._on ? 0 : 1;
  try{
    const ex = {}; ex[key]=v;
    const j = await api('keep', ex);
    if(!j.ok) throw new Error();
    toast((key==='wifi'?'热点':'USB 共享') + '保活已' + (v?'开启':'关闭'));
    refresh();
  }catch(e){ toast('设置失败'); }
}
$('#keepWifi').addEventListener('click', ()=>toggleKeep('wifi','#keepWifi'));
$('#keepUsb').addEventListener('click', ()=>toggleKeep('usb','#keepUsb'));

$('#chgStart').addEventListener('click', async ()=>{ await api('chg',{op:'start'}); toast('已启动充电控制'); setTimeout(refresh,900); });
$('#chgRestart').addEventListener('click', async ()=>{ await api('chg',{op:'restart'}); toast('已重启充电控制'); setTimeout(refresh,1600); });
$('#chgStop').addEventListener('click', async ()=>{ await api('chg',{op:'stop'}); toast('已停止并恢复充电'); setTimeout(refresh,900); });

$('#logReload').addEventListener('click', loadLog);
// full=1 带附件头，浏览器直接存成 netbatt.log
$('#logDl').addEventListener('click', ()=>{ window.location.href = '/cgi-bin/api.sh?a=log&full=1'; });
// 不用 confirm：WebView 壳里没设 WebChromeClient 时 confirm 会被直接吞掉，按钮就像坏了
let logArm = 0;
$('#logClear').addEventListener('click', async ()=>{
  const b = $('#logClear');
  if(!logArm){
    logArm = 1;
    b.textContent = '再点一次';
    b.classList.add('on');
    setTimeout(()=>{ if(logArm){ logArm = 0; b.textContent = '清空'; b.classList.remove('on'); } }, 4000);
    return;
  }
  logArm = 0;
  b.textContent = '清空';
  b.classList.remove('on');
  try{ await api('logclear'); toast('日志已清空'); }catch(e){ toast('清空失败'); }
  loadLog();
});

$('#hardReload').addEventListener('click', hardReload);
paint('#pcap','#pcapv');
paint('#rcap','#rcapv');
refresh();
loadLog();
setInterval(refresh, 3000);
setInterval(()=>{ if(!document.hidden) loadLog(); }, 15000);
</script>

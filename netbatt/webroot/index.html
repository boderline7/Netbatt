<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NetBatt 控制台</title>
<style>
:root{
  --bg:#0f1216; --card:#171c22; --line:#242c36; --fg:#e8edf3; --dim:#8b98a8;
  --acc:#3ddc84; --warn:#f5a524; --bad:#f0506e; --blue:#4c8dff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.5 -apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
  padding:14px 12px 36px;max-width:640px;margin:0 auto}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
h1{font-size:17px;margin:0}
.ver{font-size:12px;color:var(--dim);font-family:ui-monospace,Consolas,monospace}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:12.5px;color:var(--dim);font-weight:600;letter-spacing:.04em;margin:0 0 12px;
  text-transform:uppercase}
button{background:#222b36;color:var(--fg);border:1px solid #2f3946;border-radius:9px;
  padding:9px 13px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;
  -webkit-appearance:none;appearance:none;transition:background .15s,border-color .15s,transform .1s}
button:focus,button:active{outline:none}
button:active{transform:scale(.96);background:#2b3542}
button.on{background:#14301f;border-color:var(--acc);color:var(--acc)}
button.active{background:var(--acc);border-color:var(--acc);color:#0b1a12;font-weight:600}
button.danger{color:var(--bad)}
button:disabled{opacity:.34}
input{background:#0e1216;border:1px solid var(--line);color:var(--fg);border-radius:9px;
  padding:9px 12px;font-size:15px;font-family:ui-monospace,Consolas,monospace;width:100%}
input:focus{outline:none;border-color:var(--blue)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center}
.stat .l{font-size:11.5px;color:var(--dim);margin-bottom:3px}
.stat .v{font-size:15px;font-weight:600}
.stat .v.ok{color:var(--acc)}
.stat .v.off{color:#5b6779}
.stat .v.warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row + .row{margin-top:10px}
.row .grow{flex:1;min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button,.seg3 button{padding:9px 4px;font-size:13.5px}
.hint{font-size:12.5px;color:var(--dim);margin-top:10px;line-height:1.5}
.hint b{color:var(--fg)}
.batt{display:flex;align-items:baseline;margin-bottom:4px}
.batt b{font-size:38px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.batt .u{color:var(--dim);font-size:15px;margin-left:8px}
.batt .st{margin-left:auto;color:var(--dim);font-size:13.5px}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;border-bottom:1px dashed #1e252e}
.kv:last-of-type{border:0}
.kv span{color:var(--dim)}
.kv b{font-family:ui-monospace,Consolas,monospace;font-weight:600}
.logbox{background:#0b0e12;border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin:10px 0 0;
  font:12px/1.55 ui-monospace,Consolas,"Noto Sans Mono",monospace;color:#c8d3df;
  max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-all}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:#2b3440;color:#fff;padding:10px 18px;border-radius:22px;font-size:13.5px;
  opacity:0;transition:.25s;pointer-events:none;z-index:9;box-shadow:0 8px 24px #000a}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;font-size:12px;color:var(--dim);padding-top:6px;word-break:break-all}
</style>
</head>
<body>
<header>
  <h1>NetBatt 控制台</h1>
  <span class="ver" id="ver">v-</span>
</header>

<div class="grid3" style="margin-bottom:12px">
  <div class="stat"><div class="l">热点</div><div class="v off" id="s-ap">—</div></div>
  <div class="stat"><div class="l">供电</div><div class="v off" id="s-car">—</div></div>
  <div class="stat"><div class="l">已连设备</div><div class="v" id="s-cli">—</div></div>
</div>

<section class="card">
  <h2>热点模式</h2>
  <div class="row seg3">
    <button id="b-mode-auto" onclick="setMode('auto')">自动</button>
    <button id="b-mode-on" onclick="setMode('on')">常开</button>
    <button id="b-mode-off" onclick="setMode('off')">关闭</button>
  </div>
  <div class="row seg" style="margin-top:10px">
    <button id="b-hs-on" onclick="setHs(1)">立即开热点</button>
    <button id="b-hs-off" class="danger" onclick="setHs(0)">立即关热点</button>
  </div>
  <div class="hint" id="h-auto"></div>
</section>

<section class="card">
  <h2>电量 / 充电阈值</h2>
  <div class="batt"><b id="b-cap">--</b><span class="u">%</span><span class="st" id="b-st"></span></div>
  <div class="row seg" style="margin-top:6px">
    <div><div class="hint" style="margin:0 0 4px">充电上限</div><input id="b-pc" type="number" min="20" max="100" inputmode="numeric"></div>
    <div><div class="hint" style="margin:0 0 4px">恢复充电</div><input id="b-rc" type="number" min="5" max="99" inputmode="numeric"></div>
  </div>
  <div class="row seg">
    <button onclick="saveBatt()">保存阈值</button>
    <button id="b-chg" onclick="toggleChg()">充电控制</button>
  </div>
  <div class="hint" id="h-batt"></div>
</section>

<section class="card">
  <h2>无线 ADB</h2>
  <div class="row">
    <button class="grow" id="b-adb" onclick="toggleAdb()">ADB over Wi-Fi</button>
    <input id="b-port" type="number" min="1024" max="65535" inputmode="numeric" style="width:110px">
  </div>
  <div class="row">
    <button class="grow" onclick="clearPersist()">清除 persist 残留</button>
  </div>
  <div class="hint" id="h-adb"></div>
</section>

<section class="card">
  <h2>运行日志</h2>
  <div class="row seg3">
    <button onclick="loadLog()">刷新</button>
    <button onclick="logDump()">导出到 Download</button>
    <button id="b-logsw" onclick="toggleLog()">记录中</button>
  </div>
  <div class="logbox" id="logbox">加载中…</div>
  <div class="row" style="margin-top:10px">
    <button class="danger grow" onclick="logClear()">清空日志</button>
  </div>
</section>

<footer id="foot"></footer>
<div id="toast"></div>

<script>
var S = {};
function $(id){ return document.getElementById(id); }
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on');},1800); }
function bridge(){ return (window.NetBatt && window.NetBatt.setHotspot) ? window.NetBatt : null; }
function fmtLeft(s){
  s = parseInt(s,10)||0;
  if(s<=0) return '';
  var h=Math.floor(s/3600), m=Math.floor((s%3600)/60);
  return h>0 ? (h+' 小时 '+m+' 分') : (m+' 分');
}

async function api(action, extra){
  var q = 'a='+action;
  if(extra){ for(var k in extra){ q += '&'+k+'='+encodeURIComponent(extra[k]); } }
  var r = await fetch('cgi-bin/api.sh?'+q+'&_='+Date.now(), {cache:'no-store'});
  return await r.text();
}

async function refresh(){
  try{
    var r = await fetch('cgi-bin/api.sh?a=status&_='+Date.now(), {cache:'no-store'});
    S = await r.json();
  }catch(e){ $('s-ap').textContent='离线'; $('s-ap').className='v warn'; return; }
  render();
}

function render(){
  $('ver').textContent = (S.ver||'v-') + ' · ' + (S.build||'0');

  var ap = S.ap===1;
  $('s-ap').textContent = ap ? '已开启' : '已关闭';
  $('s-ap').className = 'v ' + (ap?'ok':'off');

  // 显示用原始信号，决策用确认值（有电 5s / 断电 120s 回滞）。
  // 两者不一致时标「确认中」，否则拔线后两分钟还写着“有电”，看着像 bug。
  var raw = S.power_raw===1, pow = S.power===1;
  $('s-car').textContent = (raw ? '有电' : '断电') + (raw===pow ? '' : '（确认中）');
  $('s-car').className = 'v ' + (raw?'ok':'off');
  $('s-cli').textContent = ap ? (S.clients||0)+' 台' : '—';

  // 模式
  var mode = S.mode || 'auto';
  $('b-mode-auto').className = mode==='auto' ? 'active' : '';
  $('b-mode-on').className   = mode==='on'   ? 'active' : '';
  $('b-mode-off').className  = mode==='off'  ? 'active' : '';

  // 手动开/关只在“自动”下有独立含义：常开/关闭是持久意图，
  // 手动改一下下一轮就会被模式覆盖，所以直接禁掉，避免看起来像坏了。
  $('b-hs-on').disabled  = mode!=='auto';
  $('b-hs-off').disabled = mode!=='auto';

  // 说明
  var t = [];
  if(mode==='off'){
    t.push('关闭模式：模块不会打开热点。');
  }else if(mode==='on'){
    t.push('常开模式：有电就开，断电就关，不会被空转保护关闭。');
  }else{
    t.push('自动模式：有电持续 ' + S.on_confirm + ' 秒后开，断电持续 ' + S.off_confirm + ' 秒后关。');
    if(S.suppress===1){
      t.push('<b>本次供电周期已抑制</b>，下次通电或点「立即开热点」恢复。');
    }else if(S.idle_min>0){
      if(ap && S.idle_left>0) t.push('无设备连接，' + fmtLeft(S.idle_left) + '后自动关闭。');
      else t.push('若 ' + S.idle_min + ' 分钟无设备连接，自动关闭。');
    }
  }
  $('h-auto').innerHTML = t.join('<br>');

  // 电量
  var b = S.batt || {};
  $('b-cap').textContent = b.cap || '--';
  var dirMap = {chg:'充电中', dis:'放电中', full:'已充满', idle:'待机', stop:'已停充 · 旁路供电'};
  $('b-st').textContent = (dirMap[b.dir]||'') + (b.temp?' · '+b.temp+'℃':'');
  if(document.activeElement !== $('b-pc')) $('b-pc').value = b.pc || '';
  if(document.activeElement !== $('b-rc')) $('b-rc').value = b.rc || '';
  var bc = $('b-chg');
  bc.className = b.enabled===1 ? 'on' : '';
  bc.textContent = b.enabled===1 ? '充电控制 开' : '充电控制 关';
  var chMap = {current:'限流', switch:'开关', soc:'目标电量', none:'未找到'};
  $('h-batt').innerHTML = '通道 <b>'+ (chMap[b.ch]||b.ch||'-') +'</b> · 节点 <b>'+ (b.node||'-') +'</b>' +
    (b.plat?' · 平台 '+b.plat:'');

  // ADB
  var ba2 = $('b-adb');
  ba2.className = 'grow' + (S.adb_tcp===1 ? ' on' : '');
  ba2.textContent = S.adb_tcp===1 ? 'ADB over Wi-Fi 已开' : 'ADB over Wi-Fi 已关';
  if(document.activeElement !== $('b-port') && S.adb_port) $('b-port').value = S.adb_port;
  else if(document.activeElement !== $('b-port')) $('b-port').value = 5555;
  var codeMap = {0:'未配置', 1:'监听中', 2:'已配置但未监听'};
  $('h-adb').innerHTML = '状态 <b>'+ (codeMap[S.adb_code]||'-') +'</b>' +
    (S.adb_persist ? '<br>持久属性残留：<b>'+S.adb_persist+'</b>，建议点上面的清除按钮' : '');

  // 日志开关
  var bl = $('b-logsw');
  bl.className = S.log_on===1 ? 'on' : '';
  bl.textContent = S.log_on===1 ? '记录中' : '已暂停';

  $('foot').innerHTML = (S.url ? S.url+'<br>' : '') + '日志 '+ Math.round((S.log_size||0)/1024) +'KB';
}

async function setMode(v){
  await api('mode',{v:v});
  toast(v==='auto'?'已切换：自动':(v==='on'?'已切换：常开':'已切换：关闭'));
  setTimeout(refresh,900);
}
async function setHs(on){
  if((S.mode||'auto')!=='auto'){ toast('先切到「自动」模式'); return; }
  var b = bridge(); if(b){ try{ b.setHotspot(!!on); }catch(e){} }
  await api('hs',{v:on?1:0});
  toast(on?'已请求开启热点':'已请求关闭热点');
  setTimeout(refresh,1600);
}
async function saveBatt(){
  var p=$('b-pc').value, r=$('b-rc').value;
  var j = JSON.parse(await api('batt',{pause:p, resume:r}));
  toast(j.ok?'阈值已保存':'参数不合法'); refresh();
}
async function toggleChg(){
  var op = (S.batt && S.batt.enabled===1) ? 'stop' : 'start';
  await api('chg',{op:op});
  toast(op==='start'?'充电控制已启动':'充电控制已停止');
  setTimeout(refresh,800);
}
async function toggleAdb(){
  var on = S.adb_tcp===1 ? 0 : 1;
  var j = JSON.parse(await api('adbtcp',{on:on, port:$('b-port').value}));
  toast(j.ok ? (on?'无线 ADB 已开启':'无线 ADB 已关闭') : '端口不合法');
  refresh();
}
async function clearPersist(){
  await api('clearpersist');
  toast('已尝试清除 persist 残留');
  refresh();
}
async function loadLog(){
  try{
    var r = await fetch('cgi-bin/api.sh?a=log&n=200&_='+Date.now(), {cache:'no-store'});
    var txt = await r.text();
    var box=$('logbox');
    box.textContent = txt || '（暂无日志）';
    box.scrollTop = box.scrollHeight;
  }catch(e){ $('logbox').textContent='读取失败'; }
}
async function logDump(){
  var j = JSON.parse(await api('logdump'));
  toast(j.ok ? ('已导出到 '+j.path) : '导出失败');
}
async function logClear(){
  await api('logclear');
  toast('日志已清空');
  loadLog();
}
async function toggleLog(){
  var on = S.log_on===1 ? 0 : 1;
  await api('logsw',{on:on});
  toast(on?'已开始记录':'已暂停记录');
  refresh();
}

refresh();
loadLog();
setInterval(refresh, 5000);
setInterval(loadLog, 15000);
</script>
</body>
</html>
